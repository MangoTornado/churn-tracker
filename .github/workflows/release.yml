name: Release

# Cut a release by pushing a tag:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Builds a signed Android APK and the static web bundle, and publishes both to a GitHub release. The
# version name comes from the tag and the version code from the run number, so every release installs
# over the last one.
#
# Needs four repository secrets — see docs/RELEASING.md:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#
# iOS ships as an *unsigned* IPA for sideloading. A signed build needs an Apple Developer account and
# provisioning profiles that cannot be checked into a public repo, so there is no TestFlight or App
# Store build here — but an unsigned IPA is genuinely useful: Sideloadly and AltStore re-sign it with
# the installing user's own identity. Building it needs a macOS runner, hence a separate job.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name, e.g. 0.2.0 (no leading v)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios:
    name: Unsigned iOS IPA
    # macOS because Xcode. Public repos get macOS minutes; this is the only job that needs them.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Work out the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install and generate the native project
        working-directory: app
        env:
          EXPO_NO_TELEMETRY: '1'
        run: |
          npm ci
          npx expo prebuild --platform ios --clean --no-install
          cd ios && pod install

      # A device build, not a simulator one: an IPA has to hold an arm64 iphoneos binary to install
      # on a phone. Unsigned, so no credentials are needed and none are exposed to forks.
      - name: Build unsigned for device
        working-directory: app
        run: |
          xcodebuild -workspace ios/ChurnTracker.xcworkspace -scheme ChurnTracker \
            -configuration Release -sdk iphoneos -derivedDataPath ios/build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package the IPA
        working-directory: app
        run: |
          set -euo pipefail
          APP=ios/build/Build/Products/Release-iphoneos/ChurnTracker.app
          test -d "$APP"
          # An IPA is a zip with the .app inside a top-level Payload/ directory. That is the whole
          # format; the only thing a signed one adds is a _CodeSignature and an embedded profile.
          rm -rf "$RUNNER_TEMP/ipa" && mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          test -f "$RUNNER_TEMP/ipa/Payload/ChurnTracker.app/main.jsbundle" \
            || { echo "::error::no JS bundle in the app — a Release build must embed one"; exit 1; }
          (cd "$RUNNER_TEMP/ipa" && zip -qry \
            "$GITHUB_WORKSPACE/churn-tracker-${{ steps.version.outputs.name }}-unsigned.ipa" Payload)
          ls -la "$GITHUB_WORKSPACE"/*.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: '*.ipa'
          retention-days: 1

  release:
    name: Build, sign and publish
    needs: [ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # AGP needs 17+; 21 is what the project is developed against.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      # ubuntu-latest ships an Android SDK but not necessarily the platform this project compiles
      # against, and AGP will not fetch it on its own.
      - name: Install the Android platform and build tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Work out the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NAME="${{ github.event.inputs.version }}"
          else
            NAME="${GITHUB_REF_NAME#v}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          # Monotonic across every run, which is all Android asks of a version code. Not derived from
          # the version name: 0.10.0 sorts below 0.9.0 under any scheme that tries.
          echo "code=$(( 1000 + GITHUB_RUN_NUMBER ))" >> "$GITHUB_OUTPUT"

      # Before anything expensive. A release built from code that does not pass its own tests is worse
      # than no release, because it is the version people will have installed.
      - name: Test and typecheck
        run: |
          make typecheck
          npm test
        env:
          TZ: UTC

      - name: Install the app's dependencies
        working-directory: app
        run: npm ci

      - name: Typecheck the app
        working-directory: app
        run: npx tsc --noEmit

      - name: Restore the signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. See docs/RELEASING.md."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          # A truncated secret decodes to something keytool will reject much later, with an error about
          # the keystore format rather than about the secret. Fail here instead.
          test -s "$RUNNER_TEMP/release.jks"

      # `--no-install` because `npm ci` already ran, and prebuild would otherwise redo it with
      # `npm install` and drift from the lockfile.
      - name: Generate the native Android project
        working-directory: app
        env:
          EXPO_NO_TELEMETRY: '1'
        run: npx expo prebuild --platform android --clean --no-install

      # Proves the config plugin actually did its job. Without this the build would happily produce an
      # APK signed with Android's universally-known debug key, and the only sign would be a line in a
      # log nobody reads.
      - name: The signing config was injected
        working-directory: app
        run: |
          grep -q 'churn-tracker: release signing' android/app/build.gradle \
            || { echo "::error::plugins/with-release-signing.js did not inject into build.gradle"; exit 1; }
          grep -q 'ctHasKeystore ? signingConfigs.release' android/app/build.gradle \
            || { echo "::error::the release build type is still pointing at the debug signing config"; exit 1; }

      - name: Assemble the signed release
        working-directory: app/android
        env:
          CT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CT_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CT_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export CT_ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          # ctVersionName / ctVersionCode, not versionName / versionCode — Expo's template does not
          # read the latter, so the plugin introduces its own names. See plugins/with-release-signing.js.
          ./gradlew assembleRelease \
            -PctVersionName='${{ steps.version.outputs.name }}' \
            -PctVersionCode='${{ steps.version.outputs.code }}' \
            --no-daemon
          # Two APKs, one per ABI — see the splits block in plugins/with-release-signing.js.
          for abi in arm64-v8a armeabi-v7a; do
            mv "app/build/outputs/apk/release/app-$abi-release.apk" \
               "$GITHUB_WORKSPACE/churn-tracker-${{ steps.version.outputs.name }}-$abi.apk"
          done

      - name: Verify they really are signed, and not with the debug key
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for APK in churn-tracker-${{ steps.version.outputs.name }}-*.apk; do
            echo "== $APK"
            "$BT/apksigner" verify --print-certs "$APK" | tee -a certs.txt
          done
          # Android's debug certificate is always CN=Android Debug. Shipping one would mean nobody can
          # ever install an update over it from a different key, and it is trivially forgeable.
          if grep -qi 'CN=Android Debug' certs.txt; then
            echo "::error::this APK is signed with the debug key"
            exit 1
          fi

      - name: Delete the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" certs.txt

      # Shipped alongside the APK so the web app can be self-hosted without Docker, and so there is an
      # artefact to diff when a deploy looks wrong.
      - name: Build the web bundle
        working-directory: app
        run: |
          npx expo export --platform web --output-dir dist
          cd dist && zip -qr "$GITHUB_WORKSPACE/churn-tracker-web-${{ steps.version.outputs.name }}.zip" .

      - name: Write the release notes
        run: |
          NOTES=docs/release-notes/v${{ steps.version.outputs.name }}.md
          if [ -f "$NOTES" ]; then
            cp "$NOTES" release-notes.md
          else
            # A tag with no notes file still releases, with an honest placeholder rather than an empty
            # body — but say so in the log so it can be fixed.
            echo "::warning::$NOTES does not exist; publishing generated notes only"
            printf '### Changes\n\nSee the commit log below.\n' > release-notes.md
          fi
          {
            printf '\n---\n\n'
            printf '### Install\n\n'
            printf '**Android** — take `arm64-v8a` unless your phone is older than about 2017, then `armeabi-v7a`. Android will ask you to allow installing from this source.\n\n'
            printf '**iOS** — the IPA is **unsigned**. Sideload it with Sideloadly or AltStore, which re-sign it with your own Apple ID. There is no App Store or TestFlight build.\n\n'
            printf '**Web** — unzip `churn-tracker-web-*.zip` next to the server as `web/`, or use the container image, which already contains it.\n\n'
            printf '**You need a server.** The app stores nothing locally and talks to one you run. See [DEPLOYING.md](docs/DEPLOYING.md).\n\n'
            printf 'Android APKs signed with the project release key; minSdk 24. iOS arm64, minimum 16.4.\n'
          } >> release-notes.md

      - name: Collect the IPA from the macOS job
        uses: actions/download-artifact@v4
        with:
          name: ipa

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NAME="${{ steps.version.outputs.name }}"
          ASSETS=(
            "churn-tracker-$NAME-arm64-v8a.apk"
            "churn-tracker-$NAME-armeabi-v7a.apk"
            "churn-tracker-$NAME-unsigned.ipa"
            "churn-tracker-web-$NAME.zip"
          )
          # Idempotent, so re-running a failed release or adding an asset to one cut by hand both
          # work. `create` fails if the release exists, which is the common case on a retry.
          if gh release view "v$NAME" > /dev/null 2>&1; then
            echo "v$NAME already exists — updating it"
            gh release upload "v$NAME" "${ASSETS[@]}" --clobber
            gh release edit "v$NAME" --notes-file release-notes.md
          else
            gh release create "v$NAME" "${ASSETS[@]}" \
              --title "v$NAME" \
              --notes-file release-notes.md \
              --generate-notes
          fi

      - name: Gradle log on failure
        if: failure()
        run: |
          find app/android -name '*.log' -exec tail -50 {} + 2>/dev/null || true
